<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChalChitra</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo" onclick="window.location.href='index.html'">Chalchitra</h1>
        </div>
        <div class="nav-right">
            <div class="nav-item" onclick="window.location.href='index.html'">Back to Home</div>
        </div>
    </header>

    <div class="auth-container">
        <h2 id="authTitle">Sign In</h2>
        <form id="authForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="authBtn">Sign In</button>
        </form>
        <p class="auth-toggle">
            <span id="authToggleText">Don't have an account?</span> 
            <a href="#" id="toggleAuthMode">Sign Up</a>
        </p>
        <p id="authMessage" class="auth-msg-err"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../exception/apiException.js"></script>
    <script src="../exception/validationException.js"></script>
    <script src="../js/service/apiConfig.js"></script>
    <script src="../js/service/movieService.js"></script>
    <script src="../js/service/userService.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/loginLogic.js"></script>
</body>
</html>
