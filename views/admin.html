<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ChalChitra</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo" onclick="window.location.href='index.html'">ChalChitra</h1>
        </div>
        <div class="nav-right">
            <div class="nav-item" id="adminLogoutBtn" style="display: none; color: #dc3545; font-weight: bold; cursor: pointer;">Logout</div>
            <div class="nav-item" onclick="window.location.href='index.html'">Back to Home</div>
        </div>
    </header>

    <div id="passwordScreen" class="auth-container transparent-box" class="m-auto">
        <h2>Admin Access</h2>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword">
        </div>
        <button class="btn" id="verifyAdminBtn">Enter</button>
        <p id="adminError" class="auth-msg-err"></p>
    </div>

    <div id="adminPanel" class="admin-panel-container">
        <h2>Manage Movies</h2>
        <div class="modal-content" class="admin-modal-content-new">
            <h3 id="modalTitle">Add Movie</h3>
            <form id="movieForm">
                <input type="hidden" id="movieId">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="movieTitle" required>
                </div>
                <div class="form-group">
                    <label>Genre:</label>
                    <select id="movieGenre" required style="width: 100%; padding: 8px; background: var(--nav-bg); color: white; border: 1px solid #444;">
                        <option value="Action">Action</option>
                        <option value="Drama">Drama</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Horror">Horror</option>
                        <option value="Biopic">Biopic</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Adventure">Adventure</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Language:</label>
                    <input type="text" id="movieLanguage" required>
                </div>
                <div class="form-group">
                    <label>Release Year:</label>
                    <input type="number" id="movieYear" required>
                </div>
                <div class="form-group">
                    <label>Rating:</label>
                    <input type="number" step="0.1" id="movieRating" required>
                </div>
                <div class="form-group">
                    <label>Duration:</label>
                    <input type="text" id="movieDuration" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="movieDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label>Poster URL:</label>
                    <input type="url" id="moviePoster" required>
                </div>
                <div class="form-group">
                    <label>Trailer URL (YouTube embed):</label>
                    <input type="url" id="movieTrailer" required>
                </div>
                <div class="form-group">
                    <label>Type:</label>
                    <select id="movieType" style="width: 100%; padding: 8px; background: var(--nav-bg); color: white; border: 1px solid #444;">
                        <option value="movie">Movie</option>
                        <option value="webseries">Webseries</option>
                        <option value="short">Short Movie</option>
                        <option value="cartoon">Cartoon</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="movieStatus" style="width: 100%; padding: 8px; background: var(--nav-bg); color: white; border: 1px solid #444;">
                        <option value="released">Released</option>
                        <option value="upcoming">Upcoming</option>
                    </select>
                </div>
                <button type="submit" class="btn" id="saveMovieBtn">Save Movie</button>
                <button type="button" class="btn" style="background:#555; margin-left: 10px;" id="cancelBtn">Cancel</button>
            </form>
            <div class="admin-movie-list">
                
            <div class="flex-gap-10-center">
                <input type="text" id="adminSearchInput" placeholder="Search uploaded items..." class="admin-search-input-new">
                <button id="adminSearchBtn" class="btn" class="btn-search-new">Search</button>
            </div>
            <h3>Movie List</h3>
                <ul id="adminMoviesUl">
                    <!-- List items injected here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../exception/apiException.js"></script>
    <script src="../exception/validationException.js"></script>
    <script src="../js/service/apiConfig.js"></script>
    <script src="../js/service/movieService.js"></script>
    <script src="../js/service/userService.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/adminLogic.js"></script>
</body>
</html>
